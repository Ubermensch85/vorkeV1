# ============================================================================
# Vorke V1 Plus - Kernel 6.12 Network & Security Tuning (FTTH 2.5G + Tailscale + DoQ/DoH3)
# ============================================================================

# TCP BBR Congestion Control + Fair Queueing (fq)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Socket Buffers (Sized for 4GB RAM + QUIC/HTTP3 + WireGuard)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 131072 33554432
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Queue & Backlog Tuning for Gigabit/2.5G LAN bursts
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# TCP Performance & Fast Open (TFO Client + Server)
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# Network Security & Tailscale Routing Compatibility
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
